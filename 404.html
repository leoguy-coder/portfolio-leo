<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page introuvable — Léo Guy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Inter:wght@400;500;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    background:#000;color:#fff;
    font-family:"Inter",Helvetica,Arial,sans-serif;
    min-height:100svh;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    text-align:center;padding:6vw;gap:26px;
  }
  .code{
    font-weight:900;letter-spacing:-.045em;line-height:.82;
    font-size:clamp(70px,17vw,240px);color:#D60001;
  }
  p{
    font-family:"Instrument Serif",serif;
    font-size:clamp(19px,2.6vw,32px);
    text-transform:uppercase;color:#fff;
  }
  a{
    color:#000;background:#D60001;text-decoration:none;
    font-size:13px;font-weight:600;letter-spacing:.08em;
    text-transform:uppercase;padding:12px 24px;
    transition:filter .25s;
  }
  a:hover{filter:brightness(1.15)}
</style>
</head>
<body>
  <div class="code">404</div>
  <p>Cette page n'existe pas</p>
  <a href="/">Retour à l'accueil</a>
</body>
</html>
