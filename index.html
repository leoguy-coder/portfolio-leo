<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Léo Guy — Directeur de production</title>
<meta name="description" content="Léo Guy — directeur de production audiovisuelle à Paris. Clips musicaux et défilés de mode : Ninho, Tayc, VALD, Schiaparelli, Jean Paul Gaultier, LOEWE.">

<meta property="og:title" content="Léo Guy — Directeur de production">
<meta property="og:description" content="Clips musicaux et défilés de mode. Paris.">
<meta property="og:type" content="website">
<meta property="og:image" content="assets/img/showreel-poster.jpg">
<meta name="theme-color" content="#000000">

<link rel="icon" href="favicon.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://i.ytimg.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Préloader -->
<div class="loader" id="loader"><div class="loader__num" id="loaderNum">000</div></div>

<!-- Curseur : le mot « scroll » suit la souris -->
<div class="cursor" id="cursor" aria-hidden="true">scroll</div>

<!-- Navigation -->
<nav class="nav">
  <a class="nav__link" href="mailto:leo.guy@hotel1920.com">Contact</a>
  <button class="nav__link" id="menuBtn" aria-expanded="false">Menu</button>
</nav>

<!-- Menu overlay -->
<!-- data-lenis-prevent : sans ça Lenis capte la molette et le menu ne défile pas -->
<div class="menu" id="menu" data-lenis-prevent>
  <div class="menu__inner">
    <!-- Le wordmark ramène à l'accueil -->
    <button class="menu__mark" id="menuHome" aria-label="Retour à l'accueil">LÉO GUY</button>
    <span class="menu__home-hint">← Retour à l'accueil</span>
    <div class="menu__filters">
      <button class="on" data-f="all">Tout</button>
      <button data-f="musique">Musique</button>
      <button data-f="fashion">Fashion</button>
    </div>
    <div id="menuList"></div>
  </div>
</div>

<!-- Hero : showreel -->
<header class="hero">
  <video class="hero__video" id="heroVideo" autoplay muted loop playsinline preload="auto"
         disablepictureinpicture disableremoteplayback
         poster="assets/img/showreel-poster.jpg">
    <!-- Variante légère servie aux petits écrans (960px, 7 Mo au lieu de 18) -->
    <source src="assets/videos/showreel-mobile.mp4" type="video/mp4" media="(max-width:820px)">
    <source src="assets/videos/showreel.mp4" type="video/mp4">
  </video>
  <div class="hero__scrim"></div>
  <div class="hero__mark">LÉO GUY</div>
</header>

<!-- Projets (injectés) -->
<main id="projects"></main>

<!-- Contact -->
<section class="contact" id="contact">
  <h2>Parlons<br>projet</h2>
  <a class="contact__mail" href="mailto:leo.guy@hotel1920.com">leo.guy@hotel1920.com</a>
  <div class="contact__meta">
    <span>Léo Guy — Directeur de production · Paris</span>
    <span>
      <a href="https://www.linkedin.com/in/l%C3%A9o-guy-33b641157/" target="_blank" rel="noopener">LinkedIn</a>
      &nbsp;·&nbsp;
      <a href="https://www.hotel1920.com" target="_blank" rel="noopener">Hotel1920</a>
    </span>
    <span>© 2026</span>
  </div>
</section>

<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"></script>
<script src="data/projects.js"></script>
<script src="js/main.js"></script>
</body>
</html>
